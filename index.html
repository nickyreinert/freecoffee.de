<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="freecoffee.de — Die Zufalls-Küche. Pizza, Stulle, Salat oder Cocktail: lass dich überraschen!">
  <title>freecoffee.de – Die Zufalls-Küche</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">

  <!-- IDH Design System: Manrope + IBM Plex Mono + VT323 (dot matrix) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>

  <!-- Tailwind (for layout utilities used in dynamically generated HTML) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Manrope', 'sans-serif'] },
          animation: { 'slide-up': 'slideUp 0.38s cubic-bezier(0.34,1.2,0.45,1)' },
          keyframes: {
            slideUp: {
              '0%':   { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' }
            }
          }
        }
      }
    }
  </script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfYEqk2Jwjlw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* ── IDH Design System: Tokens ───────────────────────────────── */
    :root {
      --n-0:   #ffffff;
      --n-50:  #f4f5f9;
      --n-100: #eceef4;
      --n-150: #e4e7ef;
      --n-200: #d7dbe6;
      --n-300: #c2c7d6;
      --n-400: #9aa1b4;
      --n-500: #6f7689;
      --n-600: #4b5163;
      --n-700: #363b4a;
      --n-800: #272b36;
      --n-850: #21242e;
      --n-900: #1a1c24;

      --accent-300: #9db4e8;
      --accent-400: #6f93dd;
      --accent-500: #4f78d6;
      --accent-600: #3a61bd;
      --accent-glow: rgba(79, 120, 214, 0.45);

      --success-500: #4e9e7e;
      --warning-500: #c79a4f;
      --danger-500:  #cf6b6b;

      --radius-sm:   10px;
      --radius-md:   16px;
      --radius-lg:   24px;
      --radius-xl:   32px;
      --radius-pill: 999px;

      --font-sans: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
      --font-dot:  'VT323', var(--font-mono);

      --text-2xs:  0.6875rem; --text-xs: 0.75rem; --text-sm: 0.875rem;
      --text-base: 1rem;      --text-md: 1.125rem; --text-lg: 1.375rem;
      --text-xl:   1.75rem;   --text-2xl: 2.25rem;

      --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;
      --fw-bold: 700;    --fw-extrabold: 800;
      --lh-tight: 1.1; --lh-normal: 1.5;
      --ls-tight: -0.02em; --ls-wider: 0.12em;

      --ease-soft: cubic-bezier(0.34, 1.2, 0.45, 1);
      --ease-out:  cubic-bezier(0.22, 0.61, 0.36, 1);
      --dur-fast: 130ms; --dur-base: 220ms; --dur-slow: 380ms;
    }

    :root, [data-theme="light"] {
      --bg:              var(--n-100);
      --surface:         var(--n-100);
      --surface-raised:  var(--n-50);
      --surface-sunken:  var(--n-150);
      --text-strong:     var(--n-700);
      --text-body:       var(--n-600);
      --text-muted:      var(--n-500);
      --text-faint:      var(--n-400);
      --border-hair:     var(--n-200);
      --accent:          var(--accent-500);
      --accent-strong:   var(--accent-600);
      --nm-light:        rgba(255, 255, 255, 0);
      --nm-dark:         rgba(53, 59, 74, 0.16);
      --nm-dark-strong:  rgba(53, 59, 74, 0.24);
    }

    :root {
      --nm-raised-sm:  -3px -3px 6px var(--nm-light),  3px  3px 6px var(--nm-dark);
      --nm-raised-md:  -6px -6px 12px var(--nm-light), 6px  6px 12px var(--nm-dark);
      --nm-raised-lg: -10px -10px 22px var(--nm-light), 10px 10px 22px var(--nm-dark-strong);
      --nm-sunken-sm:  inset -2px -2px 5px var(--nm-light), inset 2px 2px 5px var(--nm-dark);
      --nm-sunken-md:  inset -4px -4px 9px var(--nm-light), inset 4px 4px 9px var(--nm-dark);
      --nm-sunken-lg:  inset -7px -7px 15px var(--nm-light), inset 7px 7px 15px var(--nm-dark-strong);
      --nm-pressed:    inset -2px -2px 6px var(--nm-light), inset 2px 2px 6px var(--nm-dark);
      --nm-glow: 0 0 0 1px var(--accent-glow), 0 0 14px var(--accent-glow);
    }

    /* ── Base ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-body);
      font-size: var(--text-base);
      line-height: var(--lh-normal);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-sans);
      color: var(--text-strong);
      font-weight: var(--fw-bold);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-tight);
      margin: 0;
    }

    .idh-canvas { background: var(--bg); min-height: 100vh; }

    .idh-eyebrow {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      letter-spacing: var(--ls-wider);
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: var(--fw-medium);
    }

    /* ── Machine chassis ─────────────────────────────────────────── */
    .machine-chassis {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
      gap: 20px;
    }

    .machine-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .machine-body {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    /* ── Panels ──────────────────────────────────────────────────── */
    .machine-panel {
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-md);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
    }

    .panel-left {
      padding: 24px;
      gap: 14px;
      overflow: hidden;
    }

    .panel-right {
      padding: 24px;
      gap: 18px;
    }

    /* ── Dish selector tabs ──────────────────────────────────────── */
    .dish-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      flex-shrink: 0;
    }

    .dish-tab {
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: box-shadow var(--dur-base) var(--ease-soft), color var(--dur-fast), transform var(--dur-fast);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-weight: var(--fw-medium);
      font-size: var(--text-xs);
      line-height: 1;
    }
    .dish-tab:hover { color: var(--text-body); }
    .dish-tab:active { transform: scale(0.97); }
    .dish-tab[data-active] {
      box-shadow: var(--nm-sunken-sm), var(--nm-glow);
      color: var(--accent);
    }

    /* ── Generate button ─────────────────────────────────────────── */
    #generate-btn {
      width: 100%;
      flex-shrink: 0;
      padding: 18px 24px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: var(--text-md);
      font-weight: var(--fw-bold);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(145deg, var(--accent-strong), var(--accent));
      color: white;
      box-shadow: var(--nm-raised-md), 0 0 24px var(--accent-glow);
      transition: box-shadow var(--dur-base), transform var(--dur-fast), filter var(--dur-fast);
    }
    #generate-btn:hover  { filter: brightness(1.07); }
    #generate-btn:active { transform: scale(0.98); box-shadow: var(--nm-pressed); filter: brightness(0.95); }
    #generate-btn.btn-pizza,
    #generate-btn.btn-stulle,
    #generate-btn.btn-salat,
    #generate-btn.btn-cocktail,
    #generate-btn.btn-coffee,
    #generate-btn.btn-burger { /* inherits accent button style */ }

    /* ── Error ───────────────────────────────────────────────────── */
    .error-box {
      background: var(--surface-sunken);
      box-shadow: var(--nm-sunken-sm);
      border-radius: var(--radius-md);
      color: var(--danger-500);
      padding: 10px 14px;
      font-size: var(--text-sm);
      flex-shrink: 0;
    }

    /* ── Display screen (the "touch display" in the left panel) ──── */
    .display-screen {
      flex: 1;
      min-height: 0;
      background: var(--surface-sunken);
      box-shadow: var(--nm-sunken-md);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .display-header {
      padding: 16px 20px 14px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .display-content {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .display-content::-webkit-scrollbar       { width: 3px; }
    .display-content::-webkit-scrollbar-thumb { background: var(--n-300); border-radius: 99px; }

    /* ── Dot matrix display: dish name ───────────────────────────── */
    #dish-name {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0; /* collapse gaps between spans */
    }

    #dish-name > span:nth-child(2) {
      font-family: var(--font-dot);
      font-size: 1.85rem;
      font-weight: var(--fw-regular);
      letter-spacing: 0.07em;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow), 0 0 22px var(--accent-glow);
      display: inline-block;
      position: relative;
      padding: 5px 14px 3px;
      background: var(--surface-sunken);
      box-shadow: var(--nm-sunken-md);
      border-radius: var(--radius-sm);
      line-height: 1.2;
    }
    /* Unlit dot grid — simulates dot matrix screen */
    #dish-name > span:nth-child(2)::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-image: radial-gradient(circle, var(--n-200) 1.1px, transparent 1.1px);
      background-size: 4px 4px;
      pointer-events: none;
      opacity: 0.5;
    }

    #dish-name > span:nth-child(1) {
      font-size: 1.4rem;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── Recipe result inside display screen ─────────────────────── */
    #result-card {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Profile / settings inside display screen ────────────────── */
    #profile-panel {
      padding: 0 20px 20px;
    }

    /* ── Import banner ───────────────────────────────────────────── */
    .import-banner {
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
      border-radius: var(--radius-md);
      border: none;
      padding: 16px;
      flex-shrink: 0;
    }

    /* ── Ingredient badge ────────────────────────────────────────── */
    .ing-badge-wrapper { position: relative; display: inline-flex; align-items: center; }

    .ing-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
      border-radius: var(--radius-sm);
      padding: 4px 11px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--fw-medium);
      color: var(--text-body);
      border: none;
    }

    .ing-ignore-btn {
      position: absolute;
      top: -7px; right: -7px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
      border: none;
      color: var(--danger-500);
      font-size: 0.6rem;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--dur-fast), box-shadow var(--dur-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .ing-badge-wrapper:hover .ing-ignore-btn { opacity: 1; }
    .ing-ignore-btn:hover { box-shadow: var(--nm-pressed); }

    /* ── Slot label ──────────────────────────────────────────────── */
    .slot-label {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: var(--fw-medium);
      text-transform: uppercase;
      letter-spacing: var(--ls-wider);
      color: var(--text-faint);
      min-width: 4.5rem;
      flex-shrink: 0;
      padding-top: 4px;
    }

    /* ── Action buttons ──────────────────────────────────────────── */
    .btn-action {
      flex: 1;
      min-width: 100px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      cursor: pointer;
      transition: box-shadow var(--dur-base), transform var(--dur-fast), filter var(--dur-fast);
      border: none;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-action:active { transform: scale(0.98); }

    .btn-action-secondary {
      background: var(--surface-raised);
      color: var(--text-body);
      box-shadow: var(--nm-raised-sm);
    }
    .btn-action-secondary:hover  { color: var(--text-strong); box-shadow: var(--nm-raised-md); }
    .btn-action-secondary:active { box-shadow: var(--nm-pressed); }

    .btn-action-amazon {
      background: linear-gradient(145deg, #b8882a, var(--warning-500));
      color: white;
      box-shadow: var(--nm-raised-sm), 0 0 14px rgba(199,154,79,0.28);
    }
    .btn-action-amazon:hover  { filter: brightness(1.06); }
    .btn-action-amazon:active { box-shadow: var(--nm-pressed); filter: brightness(0.95); }

    .btn-action-special {
      background: var(--surface-raised);
      color: var(--accent);
      box-shadow: var(--nm-raised-sm);
    }
    .btn-action-special:hover  { box-shadow: var(--nm-raised-md); }
    .btn-action-special:active { box-shadow: var(--nm-pressed); }

    /* ── Special ingredient reveal ───────────────────────────────── */
    .special-box {
      padding: 14px 16px;
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
      border-radius: var(--radius-md);
    }

    /* ── Profile rows (rendered by JS) ──────────────────────────── */
    .profile-row {
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
      border-radius: var(--radius-sm);
      border: none;
    }
    .profile-row.is-fav  { box-shadow: var(--nm-raised-sm), 0 0 8px rgba(78,158,126,0.18); }
    .profile-row.is-kotz { box-shadow: var(--nm-raised-sm), 0 0 8px rgba(207,107,107,0.18); }

    .profile-btn-fav, .profile-btn-kotz {
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background var(--dur-fast), box-shadow var(--dur-fast);
    }
    .profile-btn-fav:hover   { background: rgba(78, 158, 126, 0.12); }
    .profile-btn-fav.active  { background: rgba(78, 158, 126, 0.18); box-shadow: var(--nm-sunken-sm); }
    .profile-btn-kotz:hover  { background: rgba(207, 107, 107, 0.12); }
    .profile-btn-kotz.active { background: rgba(207, 107, 107, 0.18); box-shadow: var(--nm-sunken-sm); }

    .warm-divider { border-color: var(--border-hair); }
    .font-display { font-family: var(--font-sans) !important; }
    .hidden { display: none !important; }

    /* ── RIGHT PANEL: Synthesis chamber ─────────────────────────── */
    .chamber-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--n-400);
      box-shadow: none;
      transition: background var(--dur-base), box-shadow var(--dur-base);
    }
    .status-led.active {
      background: var(--success-500);
      box-shadow: 0 0 8px rgba(78,158,126,0.55);
    }

    /* The outer bezel/frame that holds the chamber window */
    .chamber-frame {
      flex: 1;
      min-height: 0;
      position: relative;
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      align-items: stretch;
    }

    /* Corner bolts */
    .bolt {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--surface-raised);
      box-shadow: var(--nm-raised-sm);
    }
    .bolt-tl { top: 13px; left: 13px; }
    .bolt-tr { top: 13px; right: 13px; }
    .bolt-bl { bottom: 13px; left: 13px; }
    .bolt-br { bottom: 13px; right: 13px; }

    /* The chamber viewport — deeply sunken window */
    .chamber-viewport {
      flex: 1;
      border-radius: var(--radius-md);
      background: var(--n-900);
      box-shadow: var(--nm-sunken-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Inner ring — second level of depth */
    .chamber-inner {
      position: absolute;
      inset: 14px;
      border-radius: calc(var(--radius-md) - 4px);
      box-shadow: var(--nm-sunken-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animation placeholder text */
    #chamber-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 1;
    }

    #chamber-display {
      font-family: var(--font-dot);
      font-size: 2.4rem;
      letter-spacing: 0.14em;
      color: var(--n-700);
      text-align: center;
      line-height: 1;
    }

    /* ── Gauges ──────────────────────────────────────────────────── */
    .gauges-row {
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px 1fr;
      background: var(--surface-sunken);
      box-shadow: var(--nm-sunken-sm);
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
    }

    .gauge { background: var(--surface-sunken); padding: 11px 16px; }
    .gauge-sep { background: var(--border-hair); }

    .gauge-value {
      font-family: var(--font-mono);
      font-size: var(--text-md);
      font-weight: var(--fw-semibold);
      color: var(--text-faint);
      margin-top: 4px;
    }
  </style>
</head>

<body>
<div class="idh-canvas machine-chassis">

  <!-- ── Header bar ────────────────────────────────────────────── -->
  <header class="machine-header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <!-- Rising-signal logo mark -->
      <div style="width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--surface-raised); box-shadow: var(--nm-raised-md); display: grid; place-items: center; flex-shrink: 0;">
        <div style="display: flex; align-items: flex-end; gap: 4px; height: 22px;">
          <span style="width: 5px; height: 9px;  border-radius: 9px; background: var(--n-400);"></span>
          <span style="width: 5px; height: 15px; border-radius: 9px; background: var(--n-500);"></span>
          <span style="width: 5px; height: 22px; border-radius: 9px; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);"></span>
        </div>
      </div>
      <div>
        <div class="idh-eyebrow">Zufalls-Küche</div>
        <h1 style="font-size: var(--text-xl); margin-top: 3px;">freecoffee.de</h1>
      </div>
    </div>

    <button id="profile-btn"
      style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-pill); background: var(--surface-raised); box-shadow: var(--nm-raised-sm); border: none; cursor: pointer; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--fw-semibold); color: var(--text-muted); transition: box-shadow var(--dur-base), color var(--dur-fast);"
      onmouseover="this.style.color='var(--text-body)'; this.style.boxShadow='var(--nm-raised-md)'"
      onmouseout="this.style.color='var(--text-muted)'; this.style.boxShadow='var(--nm-raised-sm)'">
      <i data-lucide="sliders" style="width: 16px; height: 16px;"></i>
      Profil
    </button>
  </header>

  <!-- ── Two-panel machine body ────────────────────────────────── -->
  <div class="machine-body">

    <!-- ══ LEFT PANEL: Controls + Display Screen ══════════════════ -->
    <div class="machine-panel panel-left">

      <!-- Section eyebrow -->
      <div class="idh-eyebrow" style="flex-shrink:0;">Control panel</div>

      <!-- Import banner -->
      <div id="import-banner" class="hidden import-banner">
        <p style="font-weight: var(--fw-semibold); color: var(--text-strong); font-size: var(--text-sm); margin: 0 0 3px;">Profil aus Link importieren?</p>
        <p style="color: var(--text-muted); font-size: var(--text-sm); margin: 0 0 12px;">Enthält: <span id="import-summary"></span></p>
        <div style="display: flex; gap: 8px;">
          <button id="import-accept"
            style="padding: 8px 18px; background: linear-gradient(145deg, var(--accent-strong), var(--accent)); color: white; border-radius: var(--radius-md); border: none; cursor: pointer; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--fw-semibold); box-shadow: var(--nm-raised-sm);">
            Übernehmen
          </button>
          <button id="import-deny"
            style="padding: 8px 18px; background: var(--surface-sunken); color: var(--text-muted); border-radius: var(--radius-md); border: none; cursor: pointer; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--fw-semibold); box-shadow: var(--nm-sunken-sm);">
            Ablehnen
          </button>
        </div>
      </div>

      <!-- Dish selector: 3 × 2 grid -->
      <div class="dish-grid">
        <button class="dish-tab" data-dish="pizza">
          <i data-lucide="pizza" style="width: 20px; height: 20px;"></i>
          <span>Pizza</span>
        </button>
        <button class="dish-tab" data-dish="stulle">
          <i data-lucide="sandwich" style="width: 20px; height: 20px;"></i>
          <span>Stulle</span>
        </button>
        <button class="dish-tab" data-dish="salat">
          <i data-lucide="leaf" style="width: 20px; height: 20px;"></i>
          <span>Salat</span>
        </button>
        <button class="dish-tab" data-dish="cocktail">
          <i data-lucide="wine" style="width: 20px; height: 20px;"></i>
          <span>Cocktail</span>
        </button>
        <button class="dish-tab" data-dish="coffee">
          <i data-lucide="coffee" style="width: 20px; height: 20px;"></i>
          <span>Kaffee</span>
        </button>
        <button class="dish-tab" data-dish="burger">
          <i data-lucide="beef" style="width: 20px; height: 20px;"></i>
          <span>Burger</span>
        </button>
      </div>

      <!-- Generate button -->
      <button id="generate-btn" class="btn-pizza">
        <i data-lucide="shuffle" style="width: 20px; height: 20px;"></i>
        Würfeln
      </button>

      <!-- Error message -->
      <div id="error-msg" class="hidden error-box"></div>

      <!-- ── DISPLAY SCREEN ──────────────────────────────────────── -->
      <div class="display-screen">

        <!-- Dot matrix header — always visible, text changes with mode -->
        <div class="display-header">
          <h2 id="dish-name">
            <span style="display:none;"></span><span>READY</span>
          </h2>
          <div class="idh-eyebrow" id="display-mode-label" style="margin-top:6px; white-space:nowrap;">Output</div>
        </div>

        <hr class="warm-divider" style="border-top: 1px solid; margin: 0 20px;">

        <!-- Scrollable content area -->
        <div class="display-content">

          <!-- Recipe result (shown after generate) -->
          <div id="result-card" class="hidden" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;">
            <div id="slots-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
            <hr class="warm-divider" style="border-top: 1px solid; margin: 0;">
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <button id="reroll-btn" class="btn-action btn-action-secondary">
                <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> Nochmal
              </button>
              <button id="pdf-btn" class="btn-action btn-action-secondary">
                <i data-lucide="download" style="width: 14px; height: 14px;"></i> Rezept
              </button>
              <a id="amazon-btn" class="btn-action btn-action-amazon hidden" target="_blank" rel="noopener">
                <i data-lucide="shopping-cart" style="width: 14px; height: 14px;"></i> Bestellen
              </a>
              <button id="special-btn" class="btn-action btn-action-special hidden">
                <i data-lucide="star" style="width: 14px; height: 14px;"></i> Besondere Zutat
              </button>
            </div>
            <div id="special-ingredient" class="hidden special-box"></div>
          </div>

          <!-- Settings / profile (shown when profile-btn clicked) -->
          <div id="profile-panel" class="hidden" style="padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px;">

            <!-- Back button row -->
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div class="idh-eyebrow">Zutaten-Profil</div>
              <button id="close-profile"
                style="display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: var(--radius-pill); background: var(--surface-raised); box-shadow: var(--nm-raised-sm); border: none; cursor: pointer; font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--fw-semibold); color: var(--text-muted); transition: box-shadow var(--dur-base), color var(--dur-fast);"
                aria-label="Zurück"
                onmouseover="this.style.color='var(--text-body)'; this.style.boxShadow='var(--nm-raised-md)'"
                onmouseout="this.style.color='var(--text-muted)'; this.style.boxShadow='var(--nm-raised-sm)'">
                <i data-lucide="arrow-left" style="width: 13px; height: 13px;"></i>
                Zurück
              </button>
            </div>

            <!-- Legend -->
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <span style="display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--fw-medium); color: var(--success-500); background: var(--surface-raised); box-shadow: var(--nm-raised-sm); padding: 5px 12px; border-radius: var(--radius-pill);">
                ❤️ Lieblingskram
              </span>
              <span style="display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--fw-medium); color: var(--danger-500); background: var(--surface-raised); box-shadow: var(--nm-raised-sm); padding: 5px 12px; border-radius: var(--radius-pill);">
                🤢 Kotzliste
              </span>
            </div>

            <!-- Ingredient list (populated by JS) -->
            <div id="profile-ingredients" class="space-y-6"></div>

            <!-- Share -->
            <div style="padding-top: 14px; border-top: 1px solid var(--border-hair);">
              <button id="share-profile-btn"
                style="width: 100%; padding: 13px 18px; background: var(--surface-raised); box-shadow: var(--nm-raised-md); border-radius: var(--radius-lg); border: none; cursor: pointer; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--fw-semibold); color: var(--text-body); display: flex; align-items: center; justify-content: center; gap: 8px; transition: box-shadow var(--dur-base), color var(--dur-fast);"
                onmouseover="this.style.boxShadow='var(--nm-raised-lg)'; this.style.color='var(--text-strong)'"
                onmouseout="this.style.boxShadow='var(--nm-raised-md)'; this.style.color='var(--text-body)'">
                <i data-lucide="share-2" style="width: 15px; height: 15px;"></i>
                Profil teilen
              </button>
              <p style="font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--text-faint); text-align: center; margin: 8px 0 0;">
                Erzeugt einen Link zum Teilen
              </p>
            </div>

          </div><!-- /profile-panel -->

        </div><!-- /display-content -->
      </div><!-- /display-screen -->

    </div><!-- /panel-left -->

    <!-- ══ RIGHT PANEL: Synthesis Chamber ════════════════════════ -->
    <div class="machine-panel panel-right">

      <!-- Top bar: label + status indicator -->
      <div class="chamber-topbar">
        <div class="idh-eyebrow">Synthesis chamber</div>
        <div class="status-row">
          <div id="chamber-led" class="status-led"></div>
          <span id="chamber-status" class="idh-eyebrow">Standby</span>
        </div>
      </div>

      <!-- Chamber bezel + viewport -->
      <div class="chamber-frame">
        <!-- Corner bolts -->
        <div class="bolt bolt-tl"></div>
        <div class="bolt bolt-tr"></div>
        <div class="bolt bolt-bl"></div>
        <div class="bolt bolt-br"></div>

        <!-- Viewport window -->
        <div id="chamber-viewport" class="chamber-viewport">
          <!-- Inner depth ring -->
          <div class="chamber-inner"></div>

          <!-- Content (animation goes here later) -->
          <div id="chamber-content">
            <span id="chamber-display">STANDBY</span>
          </div>
        </div>
      </div>

      <!-- Instrument gauges -->
      <div class="gauges-row">
        <div class="gauge">
          <div class="idh-eyebrow">Temp</div>
          <div id="gauge-temp" class="gauge-value">—</div>
        </div>
        <div class="gauge-sep"></div>
        <div class="gauge">
          <div class="idh-eyebrow">Druck</div>
          <div id="gauge-pressure" class="gauge-value">—</div>
        </div>
        <div class="gauge-sep"></div>
        <div class="gauge">
          <div class="idh-eyebrow">Output</div>
          <div id="gauge-output" class="gauge-value">—</div>
        </div>
      </div>

    </div><!-- /panel-right -->

  </div><!-- /machine-body -->
</div><!-- /machine-chassis -->


<script type="module" src="js/app.js"></script>
<script>
  /* Dot matrix display mode switching — patches profile btn behavior */
  document.addEventListener('DOMContentLoaded', function () {
    const dishName     = document.getElementById('dish-name');
    const modeLabel    = document.getElementById('display-mode-label');
    const profileBtn   = document.getElementById('profile-btn');
    const closeProfile = document.getElementById('close-profile');

    profileBtn.addEventListener('click', function () {
      dishName.dataset.prevHtml = dishName.innerHTML;
      dishName.innerHTML = '<span style="display:none"></span><span>SETTINGS</span>';
      if (modeLabel) modeLabel.textContent = 'Settings';
    });

    closeProfile.addEventListener('click', function () {
      dishName.innerHTML = dishName.dataset.prevHtml
        || '<span style="display:none"></span><span>READY</span>';
      if (modeLabel) modeLabel.textContent = 'Output';
    });

    if (window.lucide) window.lucide.createIcons();
  });
</script>
</body>
</html>
